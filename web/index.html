<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FM27 Kaderplaner</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Design vor dem ersten Zeichnen setzen (kein Aufblitzen): auto | light | dark
    try {
      const t = (JSON.parse(localStorage.getItem("fm27-kaderplaner")) || {}).theme;
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header>
    <div class="titel">
      <h1>Kaderplaner</h1>
      <span id="stand" class="stand">lädt …</span>
    </div>
    <div class="steuerung">
      <label>Formation <select id="formation"></select></label>
      <label title="Wer gesetzt ist: beste Elf nach Score oder wie bisher gespielt (erfasste Spiele, ab 270 Min. auf der Position)">Aufstellung
        <select id="aufstellung">
          <option value="einsaetze">wie gespielt</option>
          <option value="score">nach Score</option>
        </select>
      </label>
      <label>Quelle
        <select id="quelle">
          <option value="db">DB (Exporte)</option>
          <option value="live">Live (FMMT-27)</option>
        </select>
      </label>
      <label title="Vergleichspool der Anker: Ligen ab dieser Stufe">Pool ab <select id="pool_min_stufe"></select></label>
      <label title="Mindestanzahl Werte je Statistik im Pool, sonst wird die Statistik verworfen">Pool-Min. <input id="anker_min_n" type="number" min="10" step="10"></label>
      <button id="suche_auf" title="Alle geladenen Spieler für ein Rollenpaar durchsuchen (Taste /)">Spielersuche</button>
      <button id="neu_laden">Neu laden</button>
      <button id="erfassen" class="leise" title="Spiellisten (letzte 20 Spiele je Spieler) aus FM27 lesen. Danach im Spiel durch die Leistungsbildschirme (Leistung → Spiele) blättern: neue Listen werden mitgelesen.">Spiele erfassen</button>
      <button id="theme" class="leise" title="Design wechseln: Auto (System) → Hell → Dunkel">Design: Auto</button>
    </div>
  </header>

  <section id="filter" class="filter">
    <label>max. Alter <input data-f="max_alter" type="number" min="15" max="40" placeholder="–"></label>
    <label>max. Marktwert (Mio.) <input data-f="max_wert_mio" type="number" min="0" step="0.5" placeholder="–"></label>
    <label>Liga ab <select data-f="min_stufe"></select></label>
    <label>Liga-Gewichtung <select data-f="gewichtung"></select></label>
    <label>Min. Kandidaten <input data-f="min_minuten" type="number" min="0" step="100"></label>
    <label>Min. eigene <input data-f="min_minuten_eigene" type="number" min="0" step="100"></label>
    <label class="check"><input data-f="nur_volle_daten" type="checkbox"> nur volle Daten</label>
    <label class="check" id="nur_suche_box"><input data-f="nur_suche" type="checkbox"> nur Spielersuche</label>
    <button id="filter_reset" class="leise">Filter zurücksetzen</button>
  </section>

  <div id="meldung" class="meldung" hidden></div>

  <main>
    <div class="feld-wrap">
      <div id="feld" class="feld">
        <div class="linie mitte"></div><div class="kreis"></div>
        <div class="strafraum oben"></div><div class="strafraum unten"></div>
      </div>
      <p class="legende">
        <span><span class="farbe t-hoch"></span>ab 66</span><span><span class="farbe t-mittel"></span>ab 40</span>
        <span><span class="farbe t-tief"></span>darunter</span><span>▲ bester Kandidat</span>
        <span class="info-i" tabindex="0" role="button" aria-label="Info zur Karte" data-info="Karte: gesetzter eigener Spieler mit Score (Paar-Score × Liga-Gewicht; 0 = Schlecht, 50 = OK, 100 = Gut). Randfarbe: grün ab 66, gelb ab 40, rot darunter.
▲ = bester Kandidat aus der Spielersuche mit Abstand zum Gesetzten. ! = eine Rolle nur teilweise bewertbar.
K = gesetzter Spieler hat Key-Attribute der Rollen unter der Liga-Schwelle (nur Hinweis, Score unverändert).
Rollen-Zuordnung ungeprüft (wissen/rollen-kpis.md).">i</span>
      </p>
    </div>
    <aside id="panel" class="panel">
      <p class="leer">Slot anklicken, um Ranglisten und Verbesserungen zu sehen.</p>
    </aside>
  </main>

  <div id="suche" class="overlay" hidden>
    <div class="profil-box suche-box" role="dialog" aria-modal="true" aria-label="Spielersuche">
      <button id="suche_zu" class="schliessen" title="Schließen (Esc)">×</button>
      <div class="suche-kopf">
        <h2>Spielersuche <span id="suche_info"></span></h2>
        <div class="suche-form">
          <label class="breit">Name oder Verein <input id="s_text" type="search" placeholder="z. B. Wirtz, Bochum …" autocomplete="off"></label>
          <label>Rolle aus Slot <select id="s_slot"></select></label>
          <span id="s_rollen" class="hinweis"></span>
          <label>Alter <input data-s="min_alter" type="number" min="15" max="45" placeholder="von"> –
            <input data-s="max_alter" type="number" min="15" max="45" placeholder="bis"></label>
          <label>max. Marktwert (Mio.) <input data-s="max_wert_mio" type="number" min="0" step="0.5" placeholder="–"></label>
          <label>Liga ab <select data-s="min_stufe"></select></label>
          <label>Min. Minuten <input data-s="min_minuten" type="number" min="0" step="100"></label>
          <label title="Spieler mit mehr fehlenden Key-Attributen (unter der Liga-Schwelle des eigenen Vereins) ausblenden; Spieler ohne Attribute bleiben drin">max. fehlende Key <input data-s="key_max_fehlt" type="number" min="0" max="20" placeholder="–"></label>
          <label class="check"><input data-s="eigene" type="checkbox"> eigene zeigen</label>
          <label class="check" id="s_nur_suche_box"><input data-s="nur_suche" type="checkbox"> nur Spielersuche</label>
          <label class="check"><input data-s="nur_volle_daten" type="checkbox"> nur volle Daten</label>
          <button id="s_reset" class="leise">zurücksetzen</button>
        </div>
      </div>
      <div id="suche_ergebnis"></div>
    </div>
  </div>

  <div id="profil" class="overlay" hidden>
    <div class="profil-box" role="dialog" aria-modal="true">
      <button id="profil_zu" class="schliessen" title="Schließen (Esc)">×</button>
      <div id="profil_inhalt"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
