# Ereignisse aus dem SpielLogger (Name ohne "Event") -> Kategorie. Reihenfolge zählt: der erste Treffer gewinnt.
# Namen stammen aus CommentaryEventDefinitions (SI.MatchTypes.dll). Nicht getroffene Namen meldet spielimport.py
# als "sonstiges" – dann hier ergänzen.
kategorien:
  tor: ['^GoalScored']
  kommentar:
    - '^(Great|GoodTeamGoal|Silent|Thrilling|Landmark|FirstEver|DummyCommentary|HighlightMarker|InstantReply)'
    - '^(GoalOne|PlayerSecondGoal|ScrappyGoal|PromisingPosition|CloseOffsideCall|TimeAddedOn)'
    - '^(RefereeCallsPlayerOver|RefereePlayedAdvantage|RefereeWavesPlayOn|TickingOff|MakingChange)'
    - '^In(Left|Right|Central)(Attack|Midfield|Defence)'
    - '^Player(TakesTimeWithSetPiece|TimeWasting)'
    - '^(Wait$|MissedInterception|MissedHeader|FindsAGap)'
    - '^(PlayerPutsBallOutOfPlayForInjury|PlayerNeedsOnFieldTreatment|PlayerInjured|PlayerTakesHisTime)'
    - '^(PlayerError|SoloGoalMissed|FreeKickChanceCentral|HalfTime)'
    - '^(StumbleOverAfterSkillMove|PlayerTakesTimeWith|GoalkeeperGoesForward|Team(Hanging|Having)|FullTime)'
    - '^(TwoGoals|VarDecision|VarResult|ReplacingInjured|FansLeaving|PlayerLooksMotivated|RefereePlaysAdvantage)'
    - '^(CleanThrough|TeamHadBetterOfHalf)'
    - '^(CounterAttackGoal|ClinchingGoal|PulledOneBack|PlayerLooksFiredUp|PlayerHurtInChallenge)'
    - '^(TeamDominateHalf|SpottedKeeperOffHisLine|GoodCounterAttackGoal|TeamMarchOn)'
    - '^(BadPassInOwnArea|DismalMatch)'
  lauf: ['^PlayerLooksToLatchOnto']
  zuruf: ['^TouchlineShout']
  konter: ['^TeamOnCounter']
  wechsel: ['Substitution', '^ChangeFormation']
  karte: ['Card$']
  elfmeter: ['LeadsToPenalty', '^(Take|Restart)Penalty']
  foul: ['^Foul', '^HandBall']
  abseits: ['Offside']
  standard: ['^ThrowReturnPossession', '^Take(ShortCorner|Corner|ThrowIn|FreeKick|GoalKick)', '^KickOff', '^StartMatch']
  pfiff: ['^Restart']
  block: ['^BlockShot']
  parade: ['^GoodSave', '^GoalkeeperBlock', '^GoalkeeperParry', '^GoalkeeperTippedOver', '^Goalkeeper(TippedWide|Held|Punch)', '^GoalieCatchBall']
  torwart: ['^Goalkeeper(ClearBall|ClearanceFromHeld|ThrowPass)', '^PickUpFreeBall']
  schuss: ['^DefaultShot', '^Shot', '^Header(Over|HitsPost|HitsBar|Wide)']
  flanke: ['^Cross']
  dribbling: ['^(RunPastOpponent|CreateSpaceWithSkillMove|PlayBallAheadAndRunOnto)']
  abfangen: ['Intercept']
  zweikampf: ['Tackle', '^KeyChallenge', '^Robs']
  luftduell: ['^WinsJumpforball', '^PlayersRaceForLongBall', '^LooseBall']
  klaerung: ['^(ClearBall|ClearForThrow|HeadClear|HeadsBallBehind|WinsBallInAirAndClears|HeadIt)']
  pass: ['^(KnockdownHeader|SquarePass|LaysBallOff|AttemptPass|Pass|HeadedPass|HeaderPass|HeaderBackToKeeper|OneTwoPass|LongBall|PpmMoves)']
