# Rollenprofile mit absoluten Benchmarks: Schlecht / OK / Gut je Statistik.
# Quelle: FM Stag "What does Good look like in FM24?" (aus FM24, für FM27 ungeprüft), siehe
# wissen/benchmarks-fm24.md. Die Zahlen sind von Hand aus dem Bild abgetippt: gegenlesen.
#
# Score je Statistik: Schlecht = 0, OK = 50, Gut = 100 (linear dazwischen, geklemmt auf 0..100).
# Ist "schlecht" größer als "gut", gilt niedriger = besser (z. B. Gegentore). Profil-Score = Mittel der
# vorhandenen Statistiken, nur wenn mindestens `min_abdeckung` der Statistiken vorliegen.
#
# gewichtung: Schema aus config/ligen.yaml (stufen_gewichte) für die Liga-Gewichtung dieses Profils. Entscheidung Jimmy
#   2026-11-22: getrennt nach Angriff (standard) und Verteidigung (mild). Prüfung an den Live-Daten: flach über die Stufen
#   sind nur die Innenverteidiger; Außenverteidiger, Wing-Backs und Torhüter fallen ähnlich stark ab wie Angriffsrollen.
# stat: interner Name aus spalten.yaml. art: p90 = Zählwert -> pro 90 | pct = Quote in % | direkt = schon pro 90.
# positionen: Treffer, wenn EINE Position des Spielers passt (Export- und Live-Kürzel werden normalisiert).
#   pos = Positionskürzel, seiten = nur diese Seiten (R, L, C); fehlt "seiten", zählt jede Seite.

defaults:
  min_minuten: 900
  min_abdeckung: 0.6
  nur_senior: true          # nur Team = Senior Team (Live-Daten)
  topclubs: 20              # vs_topclub: die N Vereine mit dem höchsten Kaderwert (Summe Marktwerte) als Referenz

profile:
  torwart:
    name: Torwart
    gewichtung: mild
    positionen: [{pos: GK}]
    stats:
      - {stat: xgp, art: p90, label: "xGoals verhindert / 90", schlecht: -0.38, ok: 0, gut: 0.25}
      - {stat: gegentore_n, art: p90, label: "Gegentore / 90", schlecht: 2.15, ok: 1.41, gut: 0.75}
      - {stat: abgefangen, art: p90, label: "Abgefangene Bälle / 90", schlecht: 0.04, ok: 0.1, gut: 0.22}
      - {stat: passquote_pct, art: pct, label: "Passquote %", schlecht: 47, ok: 78, gut: 97}

  iv_stopper:
    name: Innenverteidiger - Stopper
    gewichtung: mild
    positionen: [{pos: D, seiten: [C]}]
    stats:
      - {stat: tacklings_gewonnen, art: p90, label: "Tacklings / 90", schlecht: 0.8, ok: 1.29, gut: 2.38}
      - {stat: kopfballduelle_gewonnen_pct, art: pct, label: "Kopfballquote %", schlecht: 59, ok: 72, gut: 82}
      - {stat: klaerungen, art: p90, label: "Klärungen / 90", schlecht: 0.44, ok: 0.85, gut: 1.64}
      - {stat: abgefangen, art: p90, label: "Abgefangene Bälle / 90", schlecht: 1.36, ok: 2.15, gut: 3.18}
