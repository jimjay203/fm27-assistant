# Formationen für den Kaderplaner (scripts/webapp.py).
#
# Je Slot: gruppen = Positionsgruppen aus rollen_kpis.yaml (bestimmen, welche Rollen wählbar sind und welche
# Spieler in Frage kommen: Positionsfilter der Gruppe der Rolle mit Ball). x/y = Platz auf dem Spielfeld in
# Prozent (x: 0 = links, 100 = rechts; y: 0 = gegnerisches Tor, 100 = eigenes Tor).
# vorbelegung: Rollenpaar (mit/ohne) beim ersten Öffnen; fehlt sie, gilt die erste passende Rolle der Gruppe.
# Die 4-2-3-1 übernimmt ihre Vorbelegung aus taktik_slots.yaml (Werder-Standard, Kopie aus taktik.md).

standard: "4-2-3-1"

