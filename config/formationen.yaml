# Formationen für den Kaderplaner (scripts/webapp.py).
#
# Je Slot: position = FM-Position aus rollen_positionen.yaml (bestimmt die wählbaren Rollen wie im Spiel).
# Welche Spieler in Frage kommen, bestimmt die Gruppe der Rolle mit Ball (rollen_kpis.yaml).
# label = Anzeige auf dem Spielfeld (Default: Schlüssel). Die 4-2-3-1-Schlüssel kommen aus taktik_slots.yaml und
#   sind nach Spielern benannt; gesetzt wird aber der beste Spieler, daher die neutrale Anzeige "DM r"/"DM l".
# x/y = Platz auf dem Spielfeld in Prozent (x: 0 = links, 100 = rechts; y: 0 = gegnerisches Tor, 100 = eigenes Tor).
# vorbelegung: Rollenpaar (mit/ohne) beim ersten Öffnen; fehlt sie, gilt die erste passende Rolle der Gruppe.
# Die 4-2-3-1 übernimmt ihre Vorbelegung aus taktik_slots.yaml (Werder-Standard, Kopie aus taktik.md).

standard: "4-2-3-1"

formationen:
  "4-2-3-1":
    vorbelegung_aus: taktik_slots.yaml
    slots:
      TW:            {position: TW, x: 50, y: 92}
      RV:            {position: AV, x: 88, y: 72}
      "IV r":        {position: IV, x: 63, y: 78}
      "IV l":        {position: IV, x: 37, y: 78}
      LV:            {position: AV, x: 12, y: 72}
      "DM Lynen":    {position: DM, label: "DM r", x: 62, y: 56}
