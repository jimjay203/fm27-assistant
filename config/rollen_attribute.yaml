# Schlüsselattribute je FM-Rolle (key / preferred / unnecessary)
# Quelle key/preferred (seit 25.11.2026 real, Entscheidung Jimmy): FM27, aus dem Spiel transkribiert vom Projekt
# FM Player Analyzer (ElectroHugin), übernommen aus FM27 Tactic Builder data/roles.json (GPLv3, Version
# "fm27-roles-1"), Kopie: wissen/quellen/fm27-tactic-builder-roles.json. 79 Rollen (40 mit, 39 ohne Ball).
# Vorher: sortitoutsi.net, 'FM26: Important Attributes for Every Role' (edgardavids8, 08.11.2025),
# https://sortitoutsi.net/content/75078 – 36 von 40 Mit-Ball-Rollen identisch; ohne Ball nur 3 key-Attribute,
# Standardrollen ohne Ball fehlten. Ersetzte FM26-Listen stehen als Kommentar an der Rolle.
# 'unnecessary' gibt es nur in der FM26-Quelle (unverändert übernommen).
# Deutsche Rollennamen nach wissen/rollen.md; Attributnamen wie in player_attributes.
# Verwendung: scripts/rollen_attr.py (Spalten key_mit/key_ohne/key_fehlt in rollen.py). Der Filter weist Ausfälle
# aus, verwirft aber nicht (außer mit --key-max-fehlt); die Entscheidung trifft Scouting.

# Mindestwert eines key-Attributs je Liga-Stufe des ZIELVEREINS (wir), nicht der Liga des Spielers.
# Schwellen aus wissen/rollen-meta.md (Elite 12 · L1 11 · L2 10 · L3 9 · L4 8). Zuordnung Elite/L1/... zu den
# Ansehen-Stufen aus config/ligen.yaml von Claude vorgeschlagen, von Jimmy bestätigt (in-game 07.07.2027);
# Bundesliga (Exzellent) = 12. Schwellen selbst aus einer Tabelle unbekannter FM-Version, für FM27 ungeprüft.
# Stufen ohne Eintrag: liga_schwelle_default.
liga_schwelle:
  Herausragend: 12
  Exzellent: 12
  Beeindruckend: 11
  Gut: 10
  "Recht gut": 9
liga_schwelle_default: 8

