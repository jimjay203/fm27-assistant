# Mapping FM27-Spaltenname (deutscher Export, Kader-Ansicht) -> interner Name.
# Basis: Export vom 2026-11-20 (In-Game 11.10.2026) + Tooltips von Jimmy.
#
# Schreibweisen:
#   "Spalte": name                                   # Zahl im Standardformat (zahlenformat.dezimal)
#   "Spalte": {name: x, dezimal: ".", einheit: "km", typ: text}
#     dezimal  überschreibt das Dezimalzeichen für diese Spalte (der Export mischt "," und ".")
#     einheit  Pflicht-Suffix, wird abgeschnitten; Wert ohne Einheit -> NULL + Warnung
#     typ      text | date  -> Tabelle player_info (kein Zahlenwert)
#              einsaetze    -> "6 (2)" = einsaetze_start_n / einsaetze_ein_n
#              dauer        -> "5 Wochen": Text in player_info + Stat <name>_tage_n
# Doppelte Header benennt pandas: "Endet" / "Endet.1", "Freistöße" / "Freistöße.1".
#
# Suffixe der internen Stat-Namen: ohne Suffix = Zählwert (-> _p90 in per90.py);
#   _p90 schon pro 90, _pct Rate, _avg Durchschnitt, _n Spielezähler (nicht normiert).
# Nicht gemappte Spalten werden geloggt und unverändert in player_raw gespeichert.

spalten:
  # --- Kern ---
  "Unique ID": uid
  "Spieler": name
  "Geb.": birthdate
  "Alter": age
  "Verein": club
  "Liga": league
  "Ansässig in": club_country    # Land des Vereins (Spielersuche; "Bundesliga" gibt es in DE und AT)
  "Position": position
  "Gehalt": wage
  "Transferwert": value          # Spanne -> value_min/value_max, value = Mittelwert
  "Endet": contract_end
  "Endet.1": loan_end            # Leihende (Jimmy, 2026-11-20) in der Spielersuche; "?" = keine Leihe
  "Leihdauer": {name: leihdauer, typ: zeitraum}   # Kader: "6.7.26 - 30.6.27" -> loan_start/loan_end
  "Ausgeliehen von": {name: ausgeliehen_von, typ: text}  # Stammverein; bei Verliehenen = Werder Bremen
  "Minuten": minutes

  # --- Text-/Datumsfelder (player_info) ---
  "Größe": {name: groesse, typ: text}
  "Linker Fuß": {name: fuss_links, typ: text}
  "Rechter Fuß": {name: fuss_rechts, typ: text}
  "Medienumgang": {name: medienumgang, typ: text}
  "Persönlichkeit": {name: persoenlichkeit, typ: text}
  "Nation": {name: nation, typ: text}
  "Geburtsland": {name: geburtsland, typ: text}     # Spielersuche statt "Nation"
  "Vertragsart": {name: vertragsart, typ: text}     # Spielersuche, bisher nur "Vollzeitvertrag" gesehen
  "Ablöseforderung": {name: abloeseforderung, typ: text}  # bisher nur "–"; Format bei Wert unbekannt
  "Status Eigengewächs": {name: eigengewaechs, typ: text}
  "Vertragsbeginn": {name: vertragsbeginn, typ: date}
  "Vertragsstatus": {name: vertragsstatus, typ: text}
  "Spielbelastung": {name: spielbelastung, typ: text}
  "Verletzungsanfälligkeit": {name: verletzungsanfaelligkeit, typ: text}
  "Trainingsbelastung": {name: trainingsbelastung, typ: text}
  "Wiederkehrende Verletzung": {name: wiederkehrende_verletzung, typ: text}
  "Verletzungsrisiko": {name: verletzungsrisiko, typ: text}
  "Einsatzzeiten": {name: rolle, typ: text}
  "Tatsächliche Einsatzzeiten": {name: rolle_tatsaechlich, typ: text}
  "Zufriedenheit Einsätze": {name: zufriedenheit_einsaetze, typ: text}
  "Zufriedenheit": {name: zufriedenheit, typ: text}
  "Gesamtzufriedenheit": {name: gesamtzufriedenheit, typ: text}
  "Idealpos": {name: idealpos, typ: text}
  "Ausfallszeit": {name: ausfallszeit, typ: dauer}   # Ausfall gesamt Saison (Jimmy); Monat = 30 Tage (Näherung)
  "Verletzung": {name: verletzung, typ: text}
  "Verletzt am": {name: verletzt_am, typ: date}      # "Mittwoch, 30. Dezember 2026"
  "Hierarchie": {name: hierarchie, typ: text}        # "N/V" = leer
  "Gruppen": {name: gruppe, typ: text}               # "( Kerngruppe )" -> "Kerngruppe"

  # --- Einsätze / Ergebnisse (Zähler, nicht normiert) ---
  "Eins": {name: einsaetze, typ: einsaetze}      # Starts (Einwechslungen)
  "Siege": siege_n
  "Unentschieden": unentschieden_n
  "Niederlagen": niederlagen_n
  "Zu-Null-Spiele": zu_null_n
  "Verpasste Spiele in Folge": verpasste_spiele_n
  "Gegentore": gegentore_n
  "Tore (Team)": team_tore_n
  "MGeg": team_gegentore_n                       # Tooltip: Teamgegentore

  # --- Offensiv ---
  "Tore": tore
  "Vorlagen": assists
  "xG": {name: xg, dezimal: "."}
  "xG-ohne11er": {name: npxg, dezimal: "."}
  "xA": {name: xa, dezimal: "."}
  "xG/Schuss": {name: xg_pro_schuss_avg, dezimal: ","}
  "Schüsse": schuesse
  "SchT": schuesse_aufs_tor
  "Schüsse von außerhalb des Strafraums pro 90 Minuten": schuesse_fern_p90
  "Tore von außerhalb des Strafraums": tore_fernschuss
  "Freistöße": freistoesse                       # Stat: ausgeführte Freistöße (Jimmy)
  "Elfer": elfer
  "Elfer gesamt": elfer_gesamt
  "Parierte Elfer": elfer_pariert
  "11m-Tor": elfer_tore
  "GCh": grosschancen                            # Tooltip: erspielte Großchance
  "Drb": dribblings
  "Gefoult worden": gefoult
  "Abs": abseits
  "Wertung": {name: wertung_avg, dezimal: ","}
  "SdS": spieler_des_spiels

  # --- Passspiel ---
  "Pas V": paesse_versucht
  "Ps A": paesse_angekommen
  "PrP": progressive_paesse
  "Entscheidend": schluesselpaesse
  "EntP(S)/90": {name: entscheidende_paesse_spiel_p90, dezimal: ","}  # entscheidende Pässe aus dem Spiel pro 90
  "Fla V": flanken_versucht
  "Fla A": flanken_angekommen
  "VeF": flanken_spiel_versucht
  "AnF": flanken_spiel_angekommen

  # --- Defensiv / Zweikämpfe ---
  "Kopf V": kopfbaelle_versucht
  "Kopf G": kopfbaelle_gewonnen
  "Ent Kopf/90": {name: entscheidende_kopfbaelle_p90, dezimal: ","}
  "Zwk Z": tacklings_versucht                    # Tooltip: Versuchte Tacklings
  "Gew Zwk": tacklings_gewonnen                  # Tooltip: Gewonnene Zweikämpfe (Werte <= Zwk Z)
  "Ent Zwk": tacklings_entscheidend              # Tooltip: Entscheidende Zweikämpfe
  "Blk": geblockt
  "Sgb": schuesse_geblockt
  "Geklärte Bälle": klaerungen
  "AbB": abgefangen
  "PrsV": pressing_versucht
  "PrsErf": pressing_erfolgreich
  "Fouls": fouls
  "Gelb": gelb
  "Rot": rot
  "FmT": fehler_torfolge

  # --- Laufleistung ---
  "Distanz": {name: distanz_km, einheit: "km", dezimal: ","}
  "Sprints/90": {name: sprints_p90, dezimal: ","}

  # --- Torhüter ---
  "Sgh": tw_gehalten
  "Spa": tw_pariert
  "Sag": tw_abgelenkt
  "Par %": par_pct
  "xSv %": xsv_pct
  "xGP": {name: xgp, dezimal: "."}               # expected goals prevented (Jimmy)

  # --- Attribute (Name = DB-Name nach dem Präfix attr_) ---
  "Aggressivität": attr_Aggressivität
  "Antizipation": attr_Antizipation
  "Mut": attr_Mut
  "Nervenstärke": attr_Nervenstärke
  "Konzentration": attr_Konzentration
  "Entscheidungen": attr_Entscheidungen
  "Zielstrebigkeit": attr_Zielstrebigkeit
  "Kreativität": attr_Kreativität
  "Führungsqualitäten": attr_Führungsqualitäten
  "Ohne Ball": attr_Ohne Ball
  "Stellungsspiel": attr_Stellungsspiel
  "Teamwork": attr_Teamwork
  "Übersicht": attr_Übersicht
  "Einsatzfreude": attr_Einsatzfreude
  "Ecken": attr_Ecken
  "Flanken": attr_Flanken
  "Dribbling": attr_Dribbling
  "Abschluss": attr_Abschluss
  "Ballannahme": attr_Ballannahme
  "Freistöße.1": attr_Freistöße                  # Attribut (die 1. Spalte "Freistöße" ist der Stat)
  "Kopfballtechnik": attr_Kopfballtechnik
  "Weitschüsse": attr_Weitschüsse
  "Weite Einwürfe": attr_Weite Einwürfe
  "Deckung": attr_Deckung
  "Passen": attr_Passen
  "Elfmeter": attr_Elfmeter
  "Tackling": attr_Tackling
  "Technik": attr_Technik
  "Antritt": attr_Antritt
  "Beweglichkeit": attr_Beweglichkeit
  "Balance": attr_Balance
  "Sprunghöhe": attr_Sprunghöhe
  "Grundfitness": attr_Grundfitness
  "Schnelligkeit": attr_Schnelligkeit
  "Ausdauer": attr_Ausdauer
  "Kraft": attr_Kraft
  "Abwurf": attr_Abwurf
  "Herauslaufen (Tendenz)": attr_Herauslaufen (Tendenz)
  "Reflexe": attr_Reflexe
  "Fausten": attr_Fausten
  "Eins gegen Eins": attr_Eins gegen Eins
  "Abschlag": attr_Abschlag
  "Halten": attr_Halten
  "Exzentrizität": attr_Exzentrizität
  "Kommunikation": attr_Kommunikation
  "Strafraumkontrolle": attr_Strafraumkontrolle
  "Hohe Bälle": attr_Hohe Bälle

  # --- Teamdatei (view_type spiel / team_stats); Header bewusst eindeutig, kollidiert nicht mit Spielerspalten ---
  "Datum": datum
  "Gegner": opponent
  "Heim/Auswärts": home_away
  "Taktik-Slot": tactic_slot
  "Wettbewerb": competition          # Text (Bundesliga, DFB-Pokal …); auch scripts/spiel_erfassen.py
  "xG für": xg_for
  "xG gegen": xg_against
  "Tore für": goals_for
  "Tore gegen": goals_against
  "Ballbesitz %": possession
  "Schüsse für": shots_for
  "Schüsse gegen": shots_against
  "Schüsse aufs Tor für": shots_on_target_for
  "Schüsse aufs Tor gegen": shots_on_target_against
  "Großchancen für": big_chances_for
  "Großchancen gegen": big_chances_against
  "Ecken für": corners_for
  "Ecken gegen": corners_against
  "Progressive Pässe für": prog_passes_for
  "Progressive Pässe gegen": prog_passes_against
  "Passquote für %": pass_pct_for
  "Passquote gegen %": pass_pct_against
  "Flankenquote für %": cross_pct_for
  "Flankenquote gegen %": cross_pct_against
  "PPDA für": ppda_for
  "PPDA gegen": ppda_against
  "Fouls für": fouls_for
  "Fouls gegen": fouls_against
  "Gelbe Karten für": yellow_for
  "Gelbe Karten gegen": yellow_against
  "Rote Karten für": red_for
  "Rote Karten gegen": red_against
  "Laufleistung für": distance_for
  "Laufleistung gegen": distance_against
  "Notenschnitt für": rating_for
  "Notenschnitt gegen": rating_against

# Quoten aus zwei gemappten Stats: name: [zähler, nenner] -> zähler / nenner * 100 (NULL bei nenner 0)
abgeleitet:
  kopfballduelle_gewonnen_pct: [kopfbaelle_gewonnen, kopfbaelle_versucht]
  schussgenauigkeit_pct: [schuesse_aufs_tor, schuesse]
  passquote_pct: [paesse_angekommen, paesse_versucht]
  tackling_pct: [tacklings_gewonnen, tacklings_versucht]
  flankenquote_pct: [flanken_angekommen, flanken_versucht]
  konversionsrate_pct: [tore, schuesse]   # Tore / Schüsse (inkl. Elfmeter), Benchmark-Statistik
  pressingquote_pct: [pressing_erfolgreich, pressing_versucht]
  flankenquote_spiel_pct: [flanken_spiel_angekommen, flanken_spiel_versucht]   # Flanken aus dem Spiel, ohne Standards

zahlenformat:
  dezimal: ","        # Export mischt: xG/xA/xGP mit "." (oben per Spalte überschrieben), Rest ","

gehalt:
  periode: jahr       # Export: "2,49Mio. €/J." (import.py bricht ab, wenn ein Wert etwas anderes sagt)
