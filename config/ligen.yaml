# ligen: numerische Stärke für value.py --liga-norm (Tabelle `leagues`); bewusst leer – die Ansicht
#   liefert nur Reihenfolge und Stufe, keine Zahl. Kein Schlüssel-Kollisionsschutz (nur Liga-Name).

