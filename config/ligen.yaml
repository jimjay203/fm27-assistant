# Gewichtung nach Ansehen-Stufe (Setzung, siehe unten). Faktor auf den Benchmark-Score; die Basis ist die
# Bundesliga (Stufe "Exzellent") = 1,00, weil dort euer Kader spielt. Gewichte sind keine Messwerte.
#   standard: 6 % je Stufe, Spanne 0,70 bis 1,05
#   mild:     3 % je Stufe (wie FMMT-27: nur ±15 % insgesamt)
#   steil:    10 % je Stufe
# Eine eigene Variante kann unter `stufen_gewichte` ergänzt werden. Fehlt die Stufe einer Liga (kein Alias),
# gibt es keinen Faktor: die Liga bleibt außerhalb der gewichteten Rangliste.
gewichtung_standard: standard
