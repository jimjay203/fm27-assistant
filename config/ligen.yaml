# Liga-Ranking aus der FM27-Ansicht der Wettbewerbe (3 Screenshots, abgetippt von Claude, Stand 2026-11-20).
#
# ranking: Reihenfolge = Reihenfolge der Ansicht (Rang 1 = oben); wird beim Import in `league_ranking`
#   geladen. Annahme (nicht belegt): die Ansicht ist nach Liga-Reputation sortiert – die Stufen
#   (ansehen) steigen darin monoton, `pos` nicht.
#   liga + land sind der Schlüssel (Namen wiederholen sich: Bundesliga DE/AT, Super League GR/CH ...);
#   sie müssen wie im Export geschrieben sein (Spalten "Liga" und "Ansässig in").
#   pos = "Pos." der Ansicht, vermutlich Rang im Kontinentalverband (Europa 1-49, Südamerika 1-11 ...).
# TODO: Die Liste endet bei "Nationaldivisioun" (Luxemburg, Stufe "Durchschnittlich"); weitere Ligen
#   darunter bei Bedarf nachtragen. Export-Ligen ohne Eintrag meldet der Import (z. B. "RL Nord").
#
# ligen: numerische Stärke für value.py --liga-norm (Tabelle `leagues`); bewusst leer – die Ansicht
#   liefert nur Reihenfolge und Stufe, keine Zahl. Kein Schlüssel-Kollisionsschutz (nur Liga-Name).

