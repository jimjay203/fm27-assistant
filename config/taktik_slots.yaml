# Rollen der aktuellen Werder-Taktik je Slot (mit Ball / ohne Ball), für scripts/rollen.py --slot / --alle.
#
# Quelle: saves/werder/taktik.md, Rollentabelle "Standard" ab Saisonvorbereitung 2027/28 (Entscheidung Jimmy
# 03.07.2027). Diese Datei ist eine KOPIE für die Auswertung; maßgeblich bleibt taktik.md (nur der Agent
# `taktik` ändert sie). Bei Änderungen der Taktik hier nachziehen.
# stamm: Spieler laut taktik.md (Stand dort), nur zur Orientierung in der Ausgabe - nicht aktuell geprüft.
# Slot-Schlüssel "DM Lynen"/"DM Svanberg" bleiben aus Kompatibilität (config/formationen.yaml, Anzeige "DM l"/"DM r");
# "DM Svanberg" = rechter Sechser, Stamm jetzt Stage.
# RV/LV: Rolle mit Ball aus der Gruppe fv (Flügelverteidiger-Rollen), ohne Ball aus av (Pressender AV); rollen.py
# bewertet jede Rolle in ihrer eigenen Gruppe.

quelle: "taktik.md, Rollentabelle Standard ab Vorbereitung 2027/28 (Entscheidung Jimmy 03.07.2027), Besetzung Stand 30.10.2027"

slots:
  TW:
    mit: "Torwart"
    ohne: "Linientorhüter"
    stamm: [Hein, Schlager]
  RV:
    mit: "Inverser Flügelverteidiger"
    ohne: "Pressender Außenverteidiger"
    stamm: [Keidel, Gechter, Agu, Pieper, Schmetgens, Reis]
    hinweis: "Seit 03.07.2027: rückt mit Ball neben den DM (Lynen). Bis 2026/27 mit Ball Außenverteidiger. Seit 06.07.2027 Keidel vor Gechter (Entscheidung Jimmy, entgegen Rollen-Score)."
  "IV r":
    mit: "Innenverteidiger"
    ohne: "Innenverteidiger"
    stamm: [Pfeiffer, Gechter, Stark, Pieper]
    hinweis: "Ohne Ball Innenverteidiger (Entscheidung Jimmy, bestätigt 12.12.2027, Umstellungsdatum nicht genannt; F9-Export 28.11. und 12.12.2027). Überholt: Absichernder IV (ab 03.07.2027)."
  "IV l":
    mit: "Innenverteidiger"
    ohne: "Innenverteidiger"
    stamm: [Córdoba, Andrade, Ndiaye]
    hinweis: "Ohne Ball Innenverteidiger wie IV r (bestätigt 12.12.2027); überholt: Absichernder IV (ab 03.07.2027). Bis 2026/27: Spielaufbauender IV (SpIV) / Stoppender IV. Córdoba ist Linksfuß."
  LV:
    mit: "Flügelverteidiger"
    ohne: "Pressender Außenverteidiger"
    stamm: [Ndiaye, Oppie, Agu]
    hinweis: "Seit 03.07.2027 mit Ball Flügelverteidiger (Breite links). Bis 2026/27 Außenverteidiger. Seit 04.09.2027 Oppie 1. Backup, Deman nicht mehr im Kader."
  "DM Lynen":
    mit: "Defensiver Mittelfeldspieler"
    ohne: "Abschirmender Sechser"
    stamm: [Lynen, Amatucci, Keidel, Stark]
    hinweis: "Amatucci seit 09.10.2027 erste Wechseloption für Lynen (Entscheidung Jimmy; vorher nur Spielkontroll-Option seit 04.09.2027), nicht Stamm: mit Ball Tiefer Spielmacher statt Defensiver Mittelfeldspieler, ohne Ball nicht genannt; Rollen-Score hier mit Standardrollen gerechnet. Keidel seit 06.07.2027 Stamm-RV (Doppelrolle); danach Stark."
  "DM Svanberg":
    mit: "Box-to-Box-Spieler"
    ohne: "Pressender Sechser"
    stamm: [Stage, Svanberg, Reis]
    hinweis: "Rechter Sechser. Seit 03.07.2027 ohne Ball Pressender Sechser (bis 2026/27 Flügelsichernder Sechser). Amatucci seit 04.09.2027 unter DM Lynen (Option für Lynen), nicht mehr hier."
  "OM r":
    mit: "Flügelspieler"
    ohne: "Mitarbeitender Flügelspieler"
    stamm: [Arthur, Guliashvili, Chuki, Agu]
    hinweis: "Seit 03.07.2027 (bis 2026/27 Außenstürmer / Umschaltflügelspieler). Seit 06.07.2027 Arthur (vorher RV); kein Transfer OM r nötig. Seit 17.07.2027: Mbangula nicht mehr im Kader; Chuki nur als Plan E (mit Ball Äußerer Spielmacher, ohne Ball Inverser Umschaltflügelspieler), Rollen-Score hier mit Standardrollen gerechnet. Seit 04.09.2027 Backups Guliashvili, dann Chuki (Plan E). Guliashvili erster Backup trotz Rollen-Score Vorsaison 32 (Daten vermutlich aus anderer Position), Neubewertung nach 5 BL-Spielen mit echten Einsätzen. Arthur verletzt seit 16.10.2027 (Dauer offen), Guliashvili vertritt; fällt auch er aus: Plan E. Agu am 20.10.2027 als zusätzliche offensive Wechseloption getestet, keine beschlossene Reihenfolge."
  "OM z":
    mit: "Vorgeschobener Spielmacher"
    ohne: "Mitarbeitender Zehner"
    stamm: [Chuki, Medina, Svanberg]
    hinweis: "Seit 03.07.2027: mit Ball Vorgeschobener Spielmacher statt Zweiter Stürmer. Seit 17.07.2027 Medina Rotation hinter Chuki (nicht DM); Medina wieder im Einsatz (Start OM z in Meppen 27.10.2027; Verletzung vom 23.08.2027 überholt, Genesungsdatum nicht erfasst)."
  "OM l":
    mit: "Inverser Außenstürmer"
    ohne: "Mitarbeitender Flügelspieler"
    stamm: [Grüll, Guliashvili, Erevbenagie]
    hinweis: "Grüll in den 6 Spielen 09.10.–30.10.2027 wieder auf OM l (Verletzung vom 14.08.2027 überholt, Genesungsdatum nicht erfasst). Seit 04.09.2027 Backups Guliashvili, Erevbenagie (Manneh jetzt Stamm-ST). Solange Arthur fehlt und Guliashvili OM r spielt, ist Erevbenagie erster Backup OM l (Entscheidung Jimmy, Datenstand 31.10.2027). Guliashvili erster Backup trotz Rollen-Score Vorsaison 28 (Daten vermutlich aus anderer Position), Neubewertung nach 5 BL-Spielen mit echten Einsätzen."
  ST:
    mit: "Halbraumstürmer"
    ohne: "Mittelstürmer"
    stamm: [Manneh, Kaars, Topp]
    hinweis: "Seit 03.07.2027 (bis 2026/27 Zielspieler / Zentraler Umschaltstürmer). Seit 04.09.2027 Manneh Stamm, Kaars Backup/Joker; Itten nicht mehr im Kader. Topp nur Plan D (mit Ball Zielspieler, Joker ~30 Min.); Rollen-Score hier mit Standardrollen gerechnet. Kaars nicht für die Europa League registriert (Stand 20.10.2027): dort Topp hinter Manneh."
