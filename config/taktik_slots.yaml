# Rollen der aktuellen Werder-Taktik je Slot (mit Ball / ohne Ball), für scripts/rollen.py --slot / --alle.
#
# Quelle: saves/werder/taktik.md, Rollentabelle "Standard" ab Saisonvorbereitung 2027/28 (Entscheidung Jimmy
# 03.07.2027). Diese Datei ist eine KOPIE für die Auswertung; maßgeblich bleibt taktik.md (nur der Agent
# `taktik` ändert sie). Bei Änderungen der Taktik hier nachziehen.
# stamm: Spieler laut taktik.md (Stand dort), nur zur Orientierung in der Ausgabe - nicht aktuell geprüft.
# Slot-Schlüssel "DM Lynen"/"DM Svanberg" bleiben aus Kompatibilität (config/formationen.yaml, Anzeige "DM l"/"DM r");
# "DM Svanberg" = rechter Sechser, Stamm jetzt Stage.
# RV/LV: Rolle mit Ball aus der Gruppe fv (Flügelverteidiger-Rollen), ohne Ball aus av (Pressender AV); rollen.py
# bewertet jede Rolle in ihrer eigenen Gruppe.

quelle: "taktik.md, Rollentabelle Standard ab Vorbereitung 2027/28 (Entscheidung Jimmy 03.07.2027)"

slots:
  TW:
    mit: "Torwart"
    ohne: "Linientorhüter"
    stamm: [Hein, Schlager]
  RV:
    mit: "Inverser Flügelverteidiger"
    ohne: "Pressender Außenverteidiger"
    stamm: [Keidel, Gechter, Agu, Pieper, Schmetgens, Reis]
    hinweis: "Seit 03.07.2027: rückt mit Ball neben den DM (Lynen). Bis 2026/27 mit Ball Außenverteidiger. Seit 06.07.2027 Keidel vor Gechter (Entscheidung Jimmy, entgegen Rollen-Score)."
  "IV r":
    mit: "Innenverteidiger"
    ohne: "Absichernder Innenverteidiger"
    stamm: [Pfeiffer, Gechter, Stark, Pieper]
  "IV l":
    mit: "Innenverteidiger"
    ohne: "Absichernder Innenverteidiger"
    stamm: [Córdoba, Ndiaye]
    hinweis: "Seit 03.07.2027 IV/Absichernder IV. Bis 2026/27: Spielaufbauender IV (SpIV) / Stoppender IV. Córdoba ist Linksfuß."
  LV:
    mit: "Flügelverteidiger"
    ohne: "Pressender Außenverteidiger"
    stamm: [Ndiaye, Deman]
    hinweis: "Seit 03.07.2027 mit Ball Flügelverteidiger (Breite links). Bis 2026/27 Außenverteidiger."
  "DM Lynen":
    mit: "Defensiver Mittelfeldspieler"
    ohne: "Abschirmender Sechser"
    stamm: [Lynen, Keidel, Stark]
    hinweis: "Keidel seit 06.07.2027 Stamm-RV (Doppelrolle); im Normalfall Stark erster Ersatz."
  "DM Svanberg":
    mit: "Box-to-Box-Spieler"
    ohne: "Pressender Sechser"
    stamm: [Stage, Svanberg, Reis]
    hinweis: "Rechter Sechser. Seit 03.07.2027 ohne Ball Pressender Sechser (bis 2026/27 Flügelsichernder Sechser)."
  "OM r":
    mit: "Flügelspieler"
    ohne: "Mitarbeitender Flügelspieler"
    stamm: [Arthur, Erevbenagie, Mbangula]
    hinweis: "Seit 03.07.2027 (bis 2026/27 Außenstürmer / Umschaltflügelspieler). Seit 06.07.2027 Arthur (vorher RV); Mbangula Verkaufskandidat; kein Transfer OM r nötig."
  "OM z":
    mit: "Vorgeschobener Spielmacher"
    ohne: "Mitarbeitender Zehner"
    stamm: [Chuki, Svanberg]
    hinweis: "Seit 03.07.2027: mit Ball Vorgeschobener Spielmacher statt Zweiter Stürmer."
  "OM l":
    mit: "Inverser Außenstürmer"
    ohne: "Mitarbeitender Flügelspieler"
    stamm: [Grüll, Manneh]
  ST:
    mit: "Halbraumstürmer"
    ohne: "Mittelstürmer"
    stamm: [Kaars, Manneh, Itten]
    hinweis: "Seit 03.07.2027 (bis 2026/27 Zielspieler / Zentraler Umschaltstürmer)."
