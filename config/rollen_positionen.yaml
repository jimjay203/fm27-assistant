# Wählbare Rollen je Position (wie die Rollenauswahl im FM27-Taktikbildschirm), für den Kaderplaner.
#
# Die Slots in formationen.yaml verweisen per `position` hierher. Gewertet wird jede Rolle über ihre Gruppe in
# rollen_kpis.yaml (Anker, Positionsfilter der Kandidaten: Gruppe der Rolle mit Ball). Eine Rolle kann daher in
# mehreren Positionen stehen, z. B. der Offensive Mittelfeldspieler im ZM und im OM.
# Namen wie im Spiel; FM27-Umbenennungen über alias_rollen in rollen_kpis.yaml.
#
# quelle: woher die Liste stammt. Nur ZM ist gegen FM27 abgeglichen (Screenshot), alle anderen stammen aus
# wissen/rollen.md (FM26) bzw. der bisherigen Ableitung über die Gruppen: aus FM26, für FM27 ungeprüft.

positionen:
  TW:
    quelle: "wissen/rollen.md (FM26), für FM27 ungeprüft"
    mit: [Torwart, Kompromissloser Torhüter, Ballspielender Torhüter]
    ohne: [Torwart, Linientorhüter, Libero-Torhüter]

  IV:
    quelle: "wissen/rollen.md (FM26), für FM27 ungeprüft; Halbraum-Rollen laut FM26 nur RIV/LIV in der Dreierkette"
    mit: [Innenverteidiger, Spielaufbauender Innenverteidiger, Ballspielender Innenverteidiger,
          Kompromissloser Innenverteidiger, Aufrückender Innenverteidiger, Halbraumverteidiger,
          Hinterlaufender Halbraumverteidiger]
    ohne: [Innenverteidiger, Stoppender Innenverteidiger, Absichernder Innenverteidiger, Halbraumverteidiger,
           Stoppender Halbraumverteidiger, Absichernder Halbraumverteidiger]

  AV:
    quelle: "wissen/rollen.md (FM26), für FM27 ungeprüft"
    mit: [Außenverteidiger, Inverser Außenverteidiger, Flügelverteidiger, Inverser Flügelverteidiger,
          Spielmachender Flügelverteidiger, Vorgeschobener Flügelverteidiger]
    ohne: [Außenverteidiger, Abwartender Außenverteidiger, Pressender Außenverteidiger, Flügelverteidiger,
           Abwartender Flügelverteidiger, Pressender Flügelverteidiger]

  FV:
    quelle: "wissen/rollen.md (FM26), für FM27 ungeprüft"
    mit: [Flügelverteidiger, Inverser Flügelverteidiger, Spielmachender Flügelverteidiger,
          Vorgeschobener Flügelverteidiger]
    ohne: [Flügelverteidiger, Abwartender Flügelverteidiger, Pressender Flügelverteidiger]

  DM:
    quelle: "wissen/rollen.md (FM26), für FM27 ungeprüft"
    mit: [Defensiver Mittelfeldspieler, Tiefer Spielmacher, Abkippender Sechser, Box-to-Box-Spieler,
          Box-to-Box-Spielmacher]
    ohne: [Defensiver Mittelfeldspieler, Halbverteidiger, Abschirmender Sechser, Pressender Sechser,
           Flügelsichernder Sechser]

  ZM:
    quelle: >-
      Mit Ball: FM27-Screenshot von Jimmy (M (Z), 2026-11-22), Reihenfolge wie im Spiel; die Liste war nach
      "Spielmacher" abgeschnitten, weitere Rollen möglich. Ohne Ball: wissen/rollen.md (FM26), für FM27 ungeprüft.
    mit: [Zentraler Mittelfeldspieler, Offensiver Mittelfeldspieler, Vorgeschobener Spielmacher, Weiter Achter,
          Halbraumspieler, Spielmacher]
    ohne: [Zentraler Mittelfeldspieler, Abschirmender Achter, Pressender Achter, Flügelsichernder Achter]

  OM:
    quelle: "wissen/rollen.md (FM26), für FM27 ungeprüft"
    mit: [Offensiver Mittelfeldspieler, Vorgeschobener Spielmacher, Freigeist, Halbraumspieler, Zweiter Stürmer]
    ohne: [Offensiver Mittelfeldspieler, Mitarbeitender Zehner, Zentraler Umschaltzehner,
           Ausweichender Umschaltzehner]

  FL:
    quelle: "wissen/rollen.md (FM26), für FM27 ungeprüft; FM26 trennt RM/LM und OMR/OML, hier noch eine Liste"
    mit: [Äußerer Mittelfeldspieler, Flügelspieler, Halbraumflügel, Äußerer Spielmacher, Inverser Außenstürmer,
          Außenstürmer]
    ohne: [Äußerer Mittelfeldspieler, Flügelspieler, Mitarbeitender Außenspieler, Mitarbeitender Flügelspieler,
           Äußerer Umschaltspieler, Umschaltflügelspieler, Inverser Umschaltflügelspieler]

  ST:
    quelle: "wissen/rollen.md (FM26), für FM27 ungeprüft"
    mit: [Mittelstürmer, Hängende Spitze, Falsche Neun, Zielspieler, Knipser, Halbraumstürmer]
    ohne: [Mittelstürmer, Mitarbeitender Mittelstürmer, Zentraler Umschaltstürmer, Ausweichender Umschaltstürmer]
