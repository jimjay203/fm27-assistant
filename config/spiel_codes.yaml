# Codes in den Spiellisten von FM27 ("Leistung -> Spiele", gelesen über den FMMT-Fork, /api/matchlists).
#
# Quelle der Tabellen: die Enums des Spiels selbst, gelesen aus den BepInEx-Interop-Assemblies
# (BepInEx\interop\FM.UI.dll, nur Metadaten, nichts ausgeführt; 2026-11-23, Build 6AF5C68F-18878000):
#   Rolle    = Bitnummer im Flags-Enum FM.UI.InPossessionRole (Rolle 41 -> 2^41 = SecondStriker)
#   Position = Bitnummer im Flags-Enum PositionMask + 8 (das Byte davor ist ein eigenes Feld, immer 2)
# Gegenprobe am Spielbildschirm (Grüll, Lynen, Weiser, Svanberg, Deman, Stark, Reis): alle 12 dort gesehenen Rollen
# und alle 9 gesehenen Positionen passen zu dieser Rechnung.
#
# status: bestaetigt = Spiel für Spiel gegen den Bildschirm geprüft; enum = Code aus dem Spiel-Enum, deutsche
#   Bezeichnung von Claude zugeordnet (Rollenkatalog config/rollen_kpis.yaml / wissen/rollen.md, FM26-Namen).
# name: null = Rolle aus dem Enum ohne Gegenstück im FM27-Rollenkatalog (ältere Rollen); angezeigt wird dann `enum`.

# Position: Bit im u32-Feld (Spieldatensatz +16). Bezeichnung wie in der Spalte "Pos." des Spiels.
positionen:
  8: {enum: Goalkeeper, label: "TW", status: enum}
  9: {enum: SweeperCentreNotInUse, label: "LIB", status: enum}
  10: {enum: DefenderRight, label: "V (R)", status: bestaetigt}
  11: {enum: DefenderLeft, label: "V (L)", status: bestaetigt}
  12: {enum: DefenderCentre, label: "V (Z)", status: bestaetigt}
  13: {enum: WingBackRight, label: "FV (R)", status: enum}
  14: {enum: WingBackLeft, label: "FV (L)", status: enum}
  15: {enum: DefensiveMidfielderCentre, label: "DM", status: bestaetigt}
  16: {enum: MidfielderRight, label: "M (R)", status: enum}
  17: {enum: MidfielderLeft, label: "M (L)", status: enum}
  18: {enum: MidfielderCentre, label: "M (Z)", status: bestaetigt}
  19: {enum: AttackingMidfielderRight, label: "OM (R)", status: bestaetigt}
  20: {enum: AttackingMidfielderLeft, label: "OM (L)", status: bestaetigt}
  21: {enum: AttackingMidfielderCentre, label: "OM (Z)", status: bestaetigt}
  22: {enum: AttackerCentre, label: "ST (Z)", status: enum}
  23: {enum: AttackerRight, label: "ST (Z)", status: enum}   # Spiel zeigt Stürmer als "ST (Z)"
  24: {enum: AttackerLeft, label: "ST (Z)", status: enum}

# Bits ohne eigene Position. 1: das Byte vor dem Positionsfeld (immer 2). 28/29: Seite innerhalb einer zentralen
# Position (z. B. linker/rechter IV); das Spiel zeigt sie nicht in "Pos." an.
ohne_bezeichnung: [1, 28, 29]
seiten:
  28: {enum: LeftSidedPosition, label: "links", status: enum}
  29: {enum: RightSidedPosition, label: "rechts", status: enum}

# Rolle mit Ball (Spieldatensatz +23). name wie in config/rollen_kpis.yaml (oder dessen alias_rollen).
