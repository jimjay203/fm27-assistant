[project]
name = "fm27-assistent"
version = "0.1.0"
description = "FM27-Assistent: Claude-Code-Subagents + SQLite-Auswertungen im Moneyball-Stil"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
